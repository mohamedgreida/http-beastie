<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif; /* Classic, readable font */
        }

        body {
            background-color: #fcfcfc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2c3e50;
        }

        .bio-container {
            max-width: 600px;
            width: 90%;
            padding: 40px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            display: inline-block;
            padding-bottom: 5px;
        }

        .bio-text {
            line-height: 1.8;
            font-size: 1.1rem;
            color: #444;
            text-align: justify;
        }

        /* Responsive tweak for mobile */
        @media (max-width: 480px) {
            .bio-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <div class="bio-container">
        <h1>Hello</h1>
        
        <div class="bio-text">
            <p>
                My name is Mohamed Greida 
            </p>
            </div>
    </div>

</body>
</html>
